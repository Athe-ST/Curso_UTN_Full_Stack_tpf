name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: vite-project
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vite-project/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Generar la página
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir la página generada
        uses: actions/upload-pages-artifact@v3
        with:
          path: vite-project/dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
